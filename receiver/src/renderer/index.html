<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <title>화면 미러링 수신기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 대기 화면: QR과 접속 코드 -->
  <main id="idle" class="screen">
    <section class="qr-card">
      <img id="qr" alt="접속용 QR 코드" />
      <p class="qr-caption">휴대전화 앱으로 스캔</p>
    </section>
    <section class="connect-info">
      <p class="eyebrow">화면 미러링</p>
      <h1 id="pc-name">교실 PC</h1>
      <p class="label">접속 코드</p>
      <p id="code" class="code">------</p>
      <p id="expires" class="muted"></p>
      <ol class="steps">
        <li>휴대전화를 <strong>학교 Wi-Fi</strong>에 연결합니다.</li>
        <li>‘화면 미러링’ 앱에서 QR 코드를 스캔하거나 코드를 입력합니다.</li>
        <li>이 화면에서 연결을 <strong>허용</strong>합니다.</li>
      </ol>
      <p id="address" class="muted small"></p>
      <div class="row">
        <button id="btn-new-code" class="ghost">새 코드 받기</button>
        <button id="btn-fullscreen-idle" class="ghost">전체 화면</button>
        <button id="btn-settings-idle" class="ghost">설정</button>
      </div>
    </section>
  </main>

  <!-- 휴대전화 동의 대기 -->
  <main id="waiting" class="screen center hidden">
    <div class="spinner" aria-hidden="true"></div>
    <h2>휴대전화에서 화면 공유를 시작해 주세요</h2>
    <p class="muted">휴대전화에 나타난 안내에서 <strong>‘지금 시작’</strong>을 누르면 화면이 표시됩니다.</p>
    <button id="btn-cancel-waiting" class="ghost">취소</button>
  </main>

  <!-- 공유 화면 -->
  <main id="stream" class="screen hidden">
    <canvas id="video"></canvas>
    <div id="toolbar" class="toolbar">
      <span id="stream-device" class="device"></span>
      <span id="stream-audio" class="badge hidden"></span>
      <div class="spacer"></div>
      <button id="btn-mute" class="tool" title="소리 끄기/켜기">소리 켬</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="음량" />
      <button id="btn-fullscreen" class="tool">전체 화면</button>
      <button id="btn-settings" class="tool">설정</button>
      <button id="btn-stop" class="tool danger">공유 종료</button>
    </div>
  </main>

  <!-- 연결 요청 승인 -->
  <div id="request" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="request-title">
    <div class="modal-card">
      <h2 id="request-title">화면 공유 요청</h2>
      <p class="request-device" id="request-device"></p>
      <p class="muted">이 휴대전화의 화면과 소리를 전자칠판에 표시할까요?</p>
      <div class="row big">
        <button id="btn-reject" class="ghost large">거절</button>
        <button id="btn-approve" class="primary large">허용</button>
      </div>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card settings-card">
      <h2 id="settings-title">설정</h2>
      <label>출력 모니터
        <select id="sel-display"></select>
      </label>
      <label>소리 출력 장치
        <select id="sel-audio"></select>
      </label>
      <fieldset>
        <legend>전송 품질</legend>
        <label class="radio"><input type="radio" name="mode" value="stable" /> 안정성 우선 <span class="muted small">(끊김이 적음, 720p)</span></label>
        <label class="radio"><input type="radio" name="mode" value="quality" /> 화질 우선 <span class="muted small">(글씨가 선명함, 1080p)</span></label>
      </fieldset>
      <label>PC 이름 <span class="muted small">(다음 실행부터 적용)</span>
        <input id="inp-pcname" type="text" maxlength="30" />
      </label>
      <div class="row end">
        <button id="btn-settings-close" class="primary">닫기</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="renderer.js"></script>
</body>
</html>
