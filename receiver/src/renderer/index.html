<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <title>화면 미러링 수신기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 대기 화면: QR과 접속 코드 -->
  <main id="idle" class="screen">
    <section class="qr-card">
      <img id="qr" alt="접속용 QR 코드" />
      <p class="qr-caption">휴대전화 앱으로 스캔</p>
    </section>
    <section class="connect-info">
      <p class="eyebrow">화면 미러링</p>
      <h1 id="pc-name">교실 PC</h1>
      <p class="label">접속 코드</p>
      <p id="code" class="code">------</p>
      <p id="expires" class="muted"></p>
      <ol class="steps">
        <li>휴대전화·노트북을 <strong>학교 네트워크</strong>에 연결합니다.</li>
        <li>휴대전화는 ‘화면 미러링’ 앱에서 QR 코드를 스캔하고, 노트북은 ‘화면 보내기’에 코드를 입력합니다.</li>
        <li>이 화면에서 연결을 <strong>허용</strong>합니다. 최대 <strong>6대</strong>까지 나눠서 보여 줍니다.</li>
      </ol>
      <p id="address" class="muted small"></p>
      <div class="row">
        <button id="btn-new-code" class="ghost">새 코드 받기</button>
        <button id="btn-fullscreen-idle" class="ghost">전체 화면</button>
        <button id="btn-settings-idle" class="ghost">설정</button>
      </div>
    </section>
  </main>

  <!-- 공유 화면: 기기별 분할 -->
  <main id="stage" class="screen hidden">
    <div id="grid" class="grid"></div>
    <div id="toolbar" class="toolbar">
      <button id="btn-join" class="tool join" title="QR 코드와 접속 코드 크게 보기">참여 코드 <strong id="join-code">------</strong> <span id="join-count" class="muted"></span></button>
      <div class="spacer"></div>
      <button id="btn-mute-all" class="tool">모두 소리 끄기</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="전체 음량" title="전체 음량" />
      <button id="btn-fullscreen" class="tool">전체 화면</button>
      <button id="btn-settings" class="tool">설정</button>
      <button id="btn-stop-all" class="tool danger">모두 종료</button>
    </div>
  </main>

  <template id="tile-tpl">
    <div class="tile">
      <canvas></canvas>
      <div class="tile-wait">
        <div class="spinner small" aria-hidden="true"></div>
        <p>화면 공유가 시작되기를 기다리는 중</p>
        <p class="muted small">휴대전화는 ‘지금 시작’을 눌러 주세요</p>
      </div>
      <div class="tile-bar">
        <span class="tile-name"></span>
        <span class="tile-badge hidden"></span>
        <span class="spacer"></span>
        <button class="tile-btn tile-mute" title="이 기기의 소리 켜기/끄기"></button>
        <button class="tile-btn tile-focus" title="이 화면만 크게 보기">크게</button>
        <button class="tile-btn tile-stop danger" title="이 기기의 공유 종료">종료</button>
      </div>
    </div>
  </template>

  <!-- 연결 요청 목록 -->
  <aside id="requests" class="requests hidden" aria-live="polite">
    <div class="requests-head">
      <h2>연결 요청</h2>
      <button id="btn-approve-all" class="primary hidden">모두 허용</button>
    </div>
    <ul id="request-list"></ul>
  </aside>

  <!-- 공유 중 QR 크게 보기 -->
  <div id="join" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="join-title">
    <div class="modal-card join-card">
      <h2 id="join-title">다른 모둠도 참여할 수 있어요</h2>
      <img id="join-qr" alt="접속용 QR 코드" />
      <p class="code big-code" id="join-code-big"></p>
      <p class="muted" id="join-address"></p>
      <div class="row end">
        <button id="btn-join-close" class="primary">닫기</button>
      </div>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card settings-card">
      <h2 id="settings-title">설정</h2>
      <label>출력 모니터
        <select id="sel-display"></select>
      </label>
      <label>소리 출력 장치
        <select id="sel-audio"></select>
      </label>
      <fieldset>
        <legend>전송 품질 <span class="muted small">(3대 이상이면 자동으로 분할 화면 화질)</span></legend>
        <label class="radio"><input type="radio" name="mode" value="stable" /> 안정성 우선 <span class="muted small">(끊김이 적음, 720p)</span></label>
        <label class="radio"><input type="radio" name="mode" value="quality" /> 화질 우선 <span class="muted small">(글씨가 선명함, 1080p)</span></label>
      </fieldset>
      <label>PC 이름 <span class="muted small">(다음 실행부터 적용)</span>
        <input id="inp-pcname" type="text" maxlength="30" />
      </label>
      <div class="row end">
        <button id="btn-settings-close" class="primary">닫기</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="renderer.js"></script>
</body>
</html>
