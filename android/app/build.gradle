plugins {
    id 'com.android.application'
}

android {
    namespace 'app.screenmirror.sender'
    compileSdk 35

    defaultConfig {
        applicationId 'app.screenmirror.sender'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    // 배포용 서명: keystore.properties가 있으면 release 빌드에 사용한다(docs/배포.md 참고).
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties()
        ks.load(new FileInputStream(ksFile))
        signingConfigs {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
